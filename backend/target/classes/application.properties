spring.application.name=fl-backend

# ─── Database ─────────────────────────────────────────────────────────────────
# H2 in-memory (local dev). To restore Railway, comment H2 block and un-comment PostgreSQL block.

spring.datasource.url=jdbc:h2:mem:fldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Railway PostgreSQL (restore when available)
#spring.datasource.url=jdbc:postgresql://interchange.proxy.rlwy.net:40015/railway?sslmode=require&currentSchema=public
#spring.datasource.username=postgres
#spring.datasource.password=zQPydngAXirRWKeZgJfRqKilRPAjQIHs
#spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
# H2 dialect (auto-detected; explicit entry kept for clarity)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# PostgreSQL: org.hibernate.dialect.PostgreSQLDialect

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── Security ─────────────────────────────────────────────────────────────────
app.security.jwt.secret=federated-learning-super-secret-key-2024
app.security.jwt.expiration-seconds=3600

# AES-256 key for model-weight encryption (32 bytes = 64 hex chars).
# IMPORTANT: rotate this before any production deployment.
app.security.aes.key=7a3f2c1e8b5d9f4023ac5e7b90d12f47a8c3e5f1d92b74e60a1f3c5e8b2d4f69

# ─── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.fl=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache.tomcat=WARN